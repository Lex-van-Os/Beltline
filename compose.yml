services:
  rabbbitmq:
    image: rabbitmq:4.3.8-management
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=testuser
      - RABBITMQ_DEFAULT_PASS=testuserpass
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      retries: 5

  postgresql:
    image: postgres:15.20
    container_name: bagtracking
    restart: always
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=example
    volumes:
      - bagtracking-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 1s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:6.3.0
    restart: always
    ports:
      - 8080:8080

volumes:
  rabbitmq-data:
  bagtracking-data:
